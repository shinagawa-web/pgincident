version: 2

project_name: pgincident

builds:
  - id: pgincident
    main: ./cmd/pgincident
    binary: pgincident
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/shinagawa-web/pgincident/internal/version.Version={{.Version}}

archives:
  - id: pgincident
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

brews:
  - name: pgincident
    repository:
      owner: shinagawa-web
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/shinagawa-web/pgincident"
    description: "Real-time PostgreSQL incident dashboard for the terminal"
    license: "MIT"
    install: |
      bin.install "pgincident"
    test: |
      system "#{bin}/pgincident", "--version"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: false
  prerelease: auto

changelog:
  sort: asc
  use: github
  groups:
    - title: "New Features 🚀"
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: "Bug Fixes 🐛"
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: "Maintenance 🔧"
      regexp: '^(ci|chore|refactor|perf|build)(\(.+\))?!?:'
      order: 2
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
