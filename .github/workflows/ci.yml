name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  integration:
    name: Integration tests (Postgres ${{ matrix.pg }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create pgincident user
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE USER pgincident WITH PASSWORD 'pgincident'"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "GRANT pg_monitor TO pgincident"
        env:
          PGPASSWORD: postgres

      - name: Run integration tests
        run: go test -race -v -timeout 2m -run Integration ./internal/core/...
        env:
          DATABASE_URL: postgres://pgincident:pgincident@localhost:5432/postgres

  integration-ssl:
    name: Integration tests (SSL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build SSL Postgres image
        run: docker build -t postgres-ssl dev/rds

      - name: Start SSL Postgres
        run: |
          docker run -d --name postgres-ssl \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            -v "$PWD/dev/init.sql:/docker-entrypoint-initdb.d/init.sql" \
            postgres-ssl \
            postgres -c config_file=/etc/postgresql/postgresql.conf

      - name: Wait for Postgres to be ready
        run: until docker exec postgres-ssl pg_isready -U postgres; do sleep 1; done

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create pgincident user
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE USER pgincident WITH PASSWORD 'pgincident'"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "GRANT pg_monitor TO pgincident"
        env:
          PGPASSWORD: postgres

      - name: Verify SSL is active
        run: |
          result=$(psql "postgres://postgres:postgres@localhost:5432/postgres?sslmode=require" \
            -Atc "SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()")
          [ "$result" = "t" ] || (echo "SSL not active on server" && exit 1)

      - name: Run integration tests
        run: go test -race -v -timeout 2m -run Integration ./internal/core/...
        env:
          DATABASE_URL: postgres://pgincident:pgincident@localhost:5432/postgres?sslmode=require

  install-sh:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh (latest)
        run: sh install.sh
        env:
          INSTALL_DIR: "${{ runner.temp }}/pgincident-bin"

      - name: Verify binary runs
        run: "${{ runner.temp }}/pgincident-bin/pgincident" --version

      - name: Run install.sh (pinned version)
        run: sh install.sh
        env:
          VERSION: v0.5.1
          INSTALL_DIR: "${{ runner.temp }}/pgincident-bin-pinned"

      - name: Verify pinned version
        run: |
          out=$("${{ runner.temp }}/pgincident-bin-pinned/pgincident" --version)
          echo "$out"
          echo "$out" | grep -q "0.5.1"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck --shell=bash install.sh
