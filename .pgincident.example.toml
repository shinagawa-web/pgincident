# pgincident configuration file
# Copy this file to .pgincident.toml (project directory) or ~/.pgincident.toml and edit as needed.
# Run `pgincident --init` to generate a starter file in the current directory.

# Define one or more connection presets.
# pgincident connects to the first one listed on startup.
# Press `c` in the TUI to switch between connections.

[connections.primary]
dsn = "postgres://user:password@primary:5432/mydb"

[connections.replica]
dsn = "postgres://user:password@replica:5432/mydb"

[thresholds]
# Flag queries running longer than this duration. Default: 5s
long_running = "5s"

# Flag connections stuck in idle-in-transaction longer than this duration. Default: 30s
idle_in_transaction = "30s"
